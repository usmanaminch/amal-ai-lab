<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Buddy Chat AI · Amal</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <a class="back-link" href="/">← Back to Amal’s Website</a>

    <section class="hero">
      <p class="eyebrow">Day 42 · AI Study Helper</p>
      <h1>Study Buddy Chat AI</h1>
      <p>
        Just type what you need help with. Ask for an explanation, a quiz, hints,
        homework help, or a study plan.
      </p>
    </section>

    <section class="chat-card full-chat">
      <div id="chatWindow" class="chat-window">
        <div class="message ai">
          <div class="avatar">📚</div>
          <div class="bubble">
            Hi! I’m your Study Buddy. Tell me what you’re studying or what you need help with.
          </div>
        </div>
      </div>

      <form id="chatForm" class="chat-form">
        <input id="userInput" type="text" placeholder="Example: Help me understand fractions..." required />
        <button id="sendBtn" type="submit">Send</button>
      </form>

      <div class="quick-actions">
        <button type="button" data-prompt="Explain my topic in a simple way.">Explain</button>
        <button type="button" data-prompt="Quiz me one question at a time.">Quiz Me</button>
        <button type="button" data-prompt="Give me a hint, not the full answer.">Hint</button>
        <button type="button" data-prompt="Make me a tiny study plan.">Study Plan</button>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
